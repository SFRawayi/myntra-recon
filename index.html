<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myntra Returns Reconciliation</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1d1b18;--muted:#6f6a60;--line:#e4dfd4;
  --accent:#8a3b12;--accent-soft:#f5e6dc;--ok:#1f7a4d;--ok-soft:#e1f3e9;
  --warn:#9a6b00;--warn-soft:#fbf0d2;--err:#b3261e;--err-soft:#fbe3e1;--info:#1d5c96;--info-soft:#e0ecf8;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#151412;--card:#1f1d1a;--ink:#f1ede5;--muted:#a39d91;--line:#35322c;
  --accent:#e08a57;--accent-soft:#3a271c;--ok:#5cc58f;--ok-soft:#1b3326;
  --warn:#e3b54a;--warn-soft:#3a3016;--err:#f08079;--err-soft:#3d1f1d;--info:#79b3ea;--info-soft:#1a2a3b;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:18px;margin:0}
header h1 span{color:var(--accent)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
nav{display:flex;gap:4px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);padding:12px 14px;font-size:15px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--err);color:#fff;font-size:12px;line-height:20px;text-align:center}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
section{display:none}section.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input[type=file]{padding:7px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger:hover{background:var(--err-soft)}
.btn.sm{padding:4px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .v{font-size:28px;font-weight:700}
.stat .l{font-size:13px;color:var(--muted)}
.stat.ok .v{color:var(--ok)}.stat.err .v{color:var(--err)}.stat.info .v{color:var(--info)}
.progress{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.tbl-wrap{overflow-x:auto;max-height:480px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--muted);font-weight:600;font-size:13px}
tr.clickable{cursor:pointer}tr.clickable:hover{background:var(--bg)}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.err{background:var(--err-soft);color:var(--err)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.info{background:var(--info-soft);color:var(--info)}
.pill.muted{background:var(--line);color:var(--muted)}
.scan-input{font-size:22px;padding:14px 16px;width:100%;letter-spacing:.5px}
.result{margin-top:14px;border-radius:12px;padding:18px;font-size:18px;font-weight:600;display:none}
.result small{display:block;font-weight:400;font-size:14px;margin-top:4px}
.result.ok{display:block;background:var(--ok-soft);color:var(--ok)}
.result.info{display:block;background:var(--info-soft);color:var(--info)}
.result.warn{display:block;background:var(--warn-soft);color:var(--warn)}
.result.err{display:block;background:var(--err-soft);color:var(--err)}
.muted{color:var(--muted)}.empty{color:var(--muted);padding:20px;text-align:center}
.preview{margin-top:14px;padding:14px;border:1px dashed var(--line);border-radius:10px;display:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1><span>Myntra</span> Returns Reconciliation</h1>
  <div class="hdr-actions">
    <button class="btn sm" id="backupBtn">Backup data</button>
    <button class="btn sm" id="restoreBtn">Restore</button>
    <input type="file" id="restoreFile" accept=".json" hidden>
  </div>
</header>
<nav>
  <button data-tab="upload" class="active">Upload</button>
  <button data-tab="recon">Reconcile</button>
  <button data-tab="report">Report</button>
  <button data-tab="missing">Missing IDs <span class="badge" id="missBadge">0</span></button>
</nav>

<main>
<!-- UPLOAD -->
<section id="tab-upload" class="active">
  <div class="card">
    <h2>Upload returns sheet</h2>
    <div class="row">
      <div><label>Return date</label><input type="date" id="upDate"></div>
      <div style="flex:1;min-width:240px"><label>Excel / CSV file</label><input type="file" id="upFile" accept=".xlsx,.xls,.csv" style="width:100%"></div>
    </div>
    <div class="preview" id="upPreview"></div>
  </div>
  <div class="stats" id="upStats"></div>
  <div class="card">
    <h2>Sheets uploaded for <span id="upDateLabel"></span></h2>
    <div id="upList"></div>
  </div>
</section>

<!-- RECONCILE -->
<section id="tab-recon">
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <div><label>Reconciling date</label><input type="date" id="rcDate"></div>
      <div class="muted" style="font-size:13px;padding-bottom:10px">Scan or type a tracking ID and press Enter. It is checked against this date's sheets, then against the Missing IDs list.</div>
    </div>
    <input class="scan-input" id="scanInput" placeholder="Scan tracking ID…" autocomplete="off" autofocus>
    <div class="result" id="scanResult"></div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <strong>Progress for <span id="rcDateLabel"></span></strong>
      <span class="muted" id="rcProgText"></span>
    </div>
    <div class="progress"><div id="rcBar"></div></div>
  </div>
  <div class="stats" id="rcStats"></div>
  <div class="card">
    <h2>Scan log</h2>
    <div class="tbl-wrap" id="scanLog"></div>
  </div>
</section>

<!-- REPORT -->
<section id="tab-report">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><label>Report date</label><input type="date" id="rpDate"></div>
      <button class="btn primary" id="rpExport">Download report (.xlsx)</button>
    </div>
  </div>
  <div class="stats" id="rpStats"></div>
  <div class="grid2">
    <div class="card"><h2>Remaining (not reconciled)</h2><div class="tbl-wrap" id="rpRemaining"></div></div>
    <div class="card"><h2>Scanned but not found in any sheet</h2><div class="tbl-wrap" id="rpUnknown"></div></div>
  </div>
  <div class="card"><h2>All days</h2><div class="tbl-wrap" id="rpAll"></div></div>
</section>

<!-- MISSING -->
<section id="tab-missing">
  <div class="card">
    <div class="row">
      <div><label>Date</label><select id="msDate"><option value="">All dates</option></select></div>
      <div style="flex:1;min-width:200px"><label>Search</label><input id="msSearch" placeholder="Tracking ID or SKU" style="width:100%"></div>
      <button class="btn primary" id="msExport">Export (.xlsx)</button>
    </div>
  </div>
  <div class="card"><div class="tbl-wrap" id="msTable" style="max-height:640px"></div></div>
</section>
</main>
<div id="toast"></div>

<script>
const KEY='rawayi_myntra_recon_v1';
let db=load();
let pending=null;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.days)return d;}catch(e){}return{days:{},scans:[]};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('Could not save — browser storage may be full');}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const fmtDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return `${d}-${m}-${y}`;};
const fmtTime=t=>new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const norm=v=>String(v??'').trim().toUpperCase().replace(/\s+/g,'');
const cellStr=v=>(typeof v==='number'&&Number.isInteger(v))?v.toLocaleString('fullwide',{useGrouping:false}):String(v??'');
const getDay=d=>db.days[d]||(db.days[d]={uploads:[],items:{}});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}
let actx;function beep(ok){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=ok?'sine':'square';o.frequency.value=ok?880:200;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(ok?.12:.4));}catch(e){}}

function dayStats(date){
  const d=db.days[date];
  const items=d?Object.values(d.items):[];
  const returns=d?d.uploads.reduce((a,u)=>a+u.rows,0):0;
  const rec=items.filter(i=>i.rec).length;
  return{returns,unique:items.length,rec,remaining:items.length-rec,sheets:d?d.uploads.length:0,
    recLater:items.filter(i=>i.rec&&i.recOn!==date).length};
}
function allPending(){
  const out=[];
  for(const date of Object.keys(db.days).sort())
    for(const[id,it]of Object.entries(db.days[date].items))
      if(!it.rec)out.push({date,id,sku:it.sku||''});
  return out;
}
function statCard(v,l,cls=''){return `<div class="stat ${cls}"><div class="v">${v}</div><div class="l">${l}</div></div>`;}

/* ---------- Tabs ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function showTab(t){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+t));
  renderAll();
  if(t==='recon')setTimeout(()=>$('scanInput').focus(),50);
}

/* ---------- Upload ---------- */
['upDate','rcDate','rpDate'].forEach(id=>$(id).value=todayStr());
$('upDate').onchange=()=>{renderUpload();if(pending)renderPreview();};
$('upFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    let found=null;
    for(const sn of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
      for(let i=0;i<Math.min(15,rows.length)&&!found;i++){
        const hdr=rows[i].map(h=>String(h).toLowerCase());
        const tc=hdr.findIndex(h=>/track|awb|waybill/.test(h));
        if(tc>-1){found={sheet:sn,rows,headerRow:i,trackCol:tc,skuCol:hdr.findIndex(h=>/sku/.test(h))};}
      }
      if(found)break;
    }
    if(!found){
      const sn=wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
      if(!rows.length){toast('The file looks empty');return;}
      found={sheet:sn,rows,headerRow:0,trackCol:-1,skuCol:-1};
    }
    pending={name:f.name,...found};
    renderPreview();
  }catch(err){toast('Could not read this file: '+err.message);}
};
function extractIds(p){
  const ids=[];
  for(let i=p.headerRow+1;i<p.rows.length;i++){
    const id=norm(cellStr(p.rows[i][p.trackCol]));
    if(id)ids.push({id,sku:p.skuCol>-1?String(p.rows[i][p.skuCol]??'').trim():''});
  }
  return ids;
}
function renderPreview(){
  const p=pending,box=$('upPreview');box.style.display='block';
  const hdr=p.rows[p.headerRow]||[];
  const opts=(sel)=>hdr.map((h,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(h||'Column '+(i+1))}</option>`).join('');
  const ids=p.trackCol>-1?extractIds(p):[];
  box.innerHTML=`<div><strong>${esc(p.name)}</strong> <span class="muted">(sheet: ${esc(p.sheet)})</span></div>
   <div class="row" style="margin-top:10px">
     <div><label>Tracking ID column</label><select id="pvTrack"><option value="-1">— choose —</option>${opts(p.trackCol)}</select></div>
     <div><label>SKU column (optional)</label><select id="pvSku"><option value="-1">None</option>${opts(p.skuCol)}</select></div>
   </div>
   <p>${p.trackCol>-1?`<strong>${ids.length}</strong> tracking IDs found. They will be added to <strong>${fmtDate($('upDate').value)}</strong>.`:'<span style="color:var(--err)">Pick the column that holds tracking IDs.</span>'}</p>
   <div class="row"><button class="btn primary" id="pvAdd" ${p.trackCol>-1&&ids.length?'':'disabled'}>Add sheet</button><button class="btn" id="pvCancel">Cancel</button></div>`;
  $('pvTrack').onchange=e=>{p.trackCol=+e.target.value;renderPreview();};
  $('pvSku').onchange=e=>{p.skuCol=+e.target.value;renderPreview();};
  $('pvCancel').onclick=clearPreview;
  $('pvAdd').onclick=()=>commitUpload(ids);
}
function clearPreview(){pending=null;$('upPreview').style.display='none';$('upFile').value='';}
function commitUpload(ids){
  const date=$('upDate').value;if(!date){toast('Pick a date first');return;}
  const d=getDay(date),uid='u'+Date.now();
  let dup=0,alreadyRec=0;
  for(const{id,sku}of ids){
    const it=d.items[id];
    if(it){dup++;if(!it.uploads.includes(uid))it.uploads.push(uid);if(!it.sku&&sku)it.sku=sku;}
    else d.items[id]={sku,uploads:[uid],rec:false,recAt:null,recOn:null};
  }
  d.uploads.push({id:uid,name:pending.name,at:Date.now(),rows:ids.length,dup});
  save();clearPreview();renderAll();
  toast(`Added ${ids.length} returns to ${fmtDate(date)}${dup?` (${dup} IDs already in this day)`:''}`);
}
function deleteUpload(date,uid){
  const d=db.days[date],up=d&&d.uploads.find(u=>u.id===uid);if(!up)return;
  const onlyHere=Object.entries(d.items).filter(([,it])=>it.uploads.length===1&&it.uploads[0]===uid);
  const recCount=onlyHere.filter(([,it])=>it.rec).length;
  let msg=`Delete "${up.name}" from ${fmtDate(date)}?\n\n• ${up.rows} returns will be removed from this day's count\n• ${onlyHere.length} tracking IDs that are only in this sheet will be removed`;
  if(recCount)msg+=`\n\n⚠ ${recCount} of those IDs were already scanned. Their scans will be removed too.`;
  if(!confirm(msg))return;
  const removed=new Set(onlyHere.map(([id])=>id));
  for(const[id,it]of Object.entries(d.items)){it.uploads=it.uploads.filter(u=>u!==uid);if(!it.uploads.length)delete d.items[id];}
  d.uploads=d.uploads.filter(u=>u.id!==uid);
  if(!d.uploads.length)delete db.days[date];
  db.scans=db.scans.filter(s=>!(s.src===date&&removed.has(s.id)));
  save();renderAll();
  toast(`Deleted "${up.name}" from ${fmtDate(date)}`);
}
function deleteDay(date){
  const d=db.days[date];if(!d)return;
  const recCount=Object.values(d.items).filter(i=>i.rec).length;
  let msg=`Delete ALL ${d.uploads.length} sheet(s) for ${fmtDate(date)}?\n\nThis removes ${Object.keys(d.items).length} tracking IDs for this day.`;
  if(recCount)msg+=`\n\n⚠ ${recCount} of them were already scanned. Their scans will be removed too.`;
  if(!confirm(msg))return;
  const ids=new Set(Object.keys(d.items));
  delete db.days[date];
  db.scans=db.scans.filter(s=>!(s.src===date&&ids.has(s.id)));
  save();renderAll();
  toast(`Deleted all sheets for ${fmtDate(date)}`);
}
function renderUpload(){
  const date=$('upDate').value,s=dayStats(date),d=db.days[date];
  $('upDateLabel').textContent=fmtDate(date);
  $('upStats').innerHTML=statCard(s.returns,'Returns for the day')+statCard(s.sheets,'Sheets uploaded')+statCard(s.unique,'Unique tracking IDs')+statCard(s.remaining,'Yet to reconcile','err');
  if(!d||!d.uploads.length){$('upList').innerHTML='<div class="empty">No sheets uploaded for this date yet.</div>';return;}
  $('upList').innerHTML=`<div class="tbl-wrap"><table><tr><th>File</th><th>Uploaded</th><th>Rows</th><th>Repeat IDs</th><th></th></tr>${d.uploads.map(u=>`<tr><td>${esc(u.name)}</td><td>${fmtTime(u.at)}</td><td>${u.rows}</td><td>${u.dup||0}</td><td><button class="btn sm danger" data-del="${u.id}">🗑 Delete</button></td></tr>`).join('')}</table></div>
   ${d.uploads.length>1?`<div style="margin-top:12px;text-align:right"><button class="btn sm danger" id="delDay">🗑 Delete all sheets for ${fmtDate(date)}</button></div>`:''}`;
  $('upList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteUpload(date,b.dataset.del));
  if($('delDay'))$('delDay').onclick=()=>deleteDay(date);
}

/* ---------- Reconcile ---------- */
$('rcDate').onchange=()=>{renderRecon();$('scanInput').focus();};
$('scanInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doScan(e.target.value);e.target.value='';}});
function doScan(raw){
  const id=norm(raw);if(!id)return;
  const date=$('rcDate').value,now=Date.now();
  let result,src=null,sku='';
  const d=db.days[date],it=d&&d.items[id];
  if(it){
    sku=it.sku;src=date;
    if(it.rec)result='dup';else{it.rec=true;it.recAt=now;it.recOn=date;result='ok';}
  }else{
    for(const k of Object.keys(db.days).sort()){
      if(k===date)continue;const o=db.days[k].items[id];
      if(o){sku=o.sku;src=k;if(o.rec)result='dup';else{o.rec=true;o.recAt=now;o.recOn=date;result='missing';}break;}
    }
    if(!result)result='notfound';
  }
  db.scans.push({id,at:now,date,result,src,sku});
  save();
  const r=$('scanResult');
  const msg={
    ok:['ok','✓ Reconciled',`${id}${sku?' · '+sku:''} — found in ${fmtDate(date)} sheet`],
    missing:['info','✓ Found in Missing IDs list',`${id}${sku?' · '+sku:''} — was pending from ${fmtDate(src)}, now reconciled`],
    dup:['warn','Already scanned',`${id} was already reconciled (sheet date ${fmtDate(src)})`],
    notfound:['err','✗ Not found',`${id} is not in this date's sheets or the Missing IDs list`]
  }[result];
  r.className='result '+msg[0];r.innerHTML=`${msg[1]}<small>${esc(msg[2])}</small>`;
  beep(result==='ok'||result==='missing');
  renderAll();
}
function undoScan(idx){
  const s=db.scans[idx];if(!s||s.undone)return;
  const it=db.days[s.src]&&db.days[s.src].items[s.id];
  if(it){it.rec=false;it.recAt=null;it.recOn=null;}
  s.undone=true;save();renderAll();toast('Scan undone');
}
const resPill={ok:'<span class="pill ok">Reconciled</span>',missing:'<span class="pill info">From missing list</span>',dup:'<span class="pill warn">Duplicate scan</span>',notfound:'<span class="pill err">Not found</span>'};
function renderRecon(){
  const date=$('rcDate').value,s=dayStats(date);
  $('rcDateLabel').textContent=fmtDate(date);
  const pct=s.unique?Math.round(s.rec/s.unique*100):0;
  $('rcBar').style.width=pct+'%';
  $('rcProgText').textContent=`${s.rec} / ${s.unique} (${pct}%)`;
  const scans=db.scans.map((x,i)=>({...x,i})).filter(x=>x.date===date&&!x.undone);
  $('rcStats').innerHTML=statCard(s.returns,'Returns (sheet rows)')+statCard(s.rec,'Reconciled','ok')+statCard(s.remaining,'Remaining','err')+statCard(scans.filter(x=>x.result==='missing').length,'Cleared from missing list','info')+statCard(scans.filter(x=>x.result==='notfound').length,'Not found scans','err');
  if(!scans.length){$('scanLog').innerHTML='<div class="empty">No scans yet for this date.</div>';return;}
  $('scanLog').innerHTML=`<table><tr><th>Time</th><th>Tracking ID</th><th>SKU</th><th>Result</th><th>Sheet date</th><th></th></tr>${scans.reverse().map(x=>`<tr><td>${fmtTime(x.at)}</td><td>${esc(x.id)}</td><td>${esc(x.sku)}</td><td>${resPill[x.result]}</td><td>${x.src?fmtDate(x.src):'—'}</td><td>${x.result==='ok'||x.result==='missing'?`<button class="btn sm" data-undo="${x.i}">Undo</button>`:''}</td></tr>`).join('')}</table>`;
  $('scanLog').querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>undoScan(+b.dataset.undo));
}

/* ---------- Report ---------- */
$('rpDate').onchange=renderReport;
function reportData(date){
  const d=db.days[date],items=d?Object.entries(d.items):[];
  return{
    s:dayStats(date),
    remaining:items.filter(([,i])=>!i.rec).map(([id,i])=>({id,sku:i.sku})),
    reconciled:items.filter(([,i])=>i.rec).map(([id,i])=>({id,sku:i.sku,recOn:i.recOn,recAt:i.recAt})),
    unknown:db.scans.filter(x=>x.date===date&&x.result==='notfound'&&!x.undone),
    fromMissing:db.scans.filter(x=>x.date===date&&x.result==='missing'&&!x.undone)
  };
}
function renderReport(){
  const date=$('rpDate').value,r=reportData(date),s=r.s;
  const pct=s.unique?Math.round(s.rec/s.unique*100):0;
  $('rpStats').innerHTML=statCard(s.returns,'Returns received')+statCard(s.unique,'Unique tracking IDs')+statCard(s.rec,`Reconciled (${pct}%)`,'ok')+statCard(s.remaining,'Remaining → Missing IDs','err')+statCard(s.recLater,'Reconciled on a later day','info')+statCard(r.fromMissing.length,'Old missing IDs cleared today','info');
  $('rpRemaining').innerHTML=r.remaining.length?`<table><tr><th>Tracking ID</th><th>SKU</th></tr>${r.remaining.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.sku)}</td></tr>`).join('')}</table>`:'<div class="empty">Nothing remaining 🎉</div>';
  $('rpUnknown').innerHTML=r.unknown.length?`<table><tr><th>Time</th><th>Tracking ID</th></tr>${r.unknown.map(x=>`<tr><td>${fmtTime(x.at)}</td><td>${esc(x.id)}</td></tr>`).join('')}</table>`:'<div class="empty">No unmatched scans.</div>';
  const dates=Object.keys(db.days).sort().reverse();
  $('rpAll').innerHTML=dates.length?`<table><tr><th>Date</th><th>Sheets</th><th>Returns</th><th>Unique</th><th>Reconciled</th><th>Remaining</th><th>Status</th><th></th></tr>${dates.map(dt=>{const x=dayStats(dt);return `<tr class="clickable" data-date="${dt}"><td>${fmtDate(dt)}</td><td>${x.sheets}</td><td>${x.returns}</td><td>${x.unique}</td><td>${x.rec}</td><td>${x.remaining}</td><td>${x.remaining?'<span class="pill err">Pending</span>':'<span class="pill ok">Complete</span>'}</td><td><button class="btn sm" data-manage="${dt}">Manage sheets</button></td></tr>`;}).join('')}</table>`:'<div class="empty">No data yet.</div>';
  $('rpAll').querySelectorAll('[data-date]').forEach(tr=>tr.onclick=()=>{$('rpDate').value=tr.dataset.date;renderReport();});
  $('rpAll').querySelectorAll('[data-manage]').forEach(b=>b.onclick=e=>{e.stopPropagation();$('upDate').value=b.dataset.manage;showTab('upload');});
}
$('rpExport').onclick=()=>{
  const date=$('rpDate').value,r=reportData(date),s=r.s;
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
    ['Myntra Returns Reconciliation Report'],['Date',fmtDate(date)],[],
    ['Returns received',s.returns],['Unique tracking IDs',s.unique],['Reconciled',s.rec],['Remaining',s.remaining],
    ['Reconciled on a later day',s.recLater],['Old missing IDs cleared on this day',r.fromMissing.length],['Not-found scans',r.unknown.length]]),'Summary');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.reconciled.map(x=>({'Tracking ID':x.id,SKU:x.sku,'Reconciled on':fmtDate(x.recOn),'Time':x.recAt?fmtTime(x.recAt):''}))),'Reconciled');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.remaining.map(x=>({'Tracking ID':x.id,SKU:x.sku}))),'Remaining');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.fromMissing.map(x=>({'Tracking ID':x.id,SKU:x.sku,'Original sheet date':fmtDate(x.src)}))),'Cleared from missing');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.unknown.map(x=>({'Tracking ID':x.id,'Scanned at':fmtTime(x.at)}))),'Not found scans');
  XLSX.writeFile(wb,`Myntra_Recon_${fmtDate(date)}.xlsx`);
};

/* ---------- Missing ---------- */
$('msDate').onchange=renderMissing;$('msSearch').oninput=renderMissing;
function missingFiltered(){
  const f=$('msDate').value,q=norm($('msSearch').value);
  return allPending().filter(x=>(!f||x.date===f)&&(!q||x.id.includes(q)||norm(x.sku).includes(q)));
}
function renderMissing(){
  const all=allPending(),sel=$('msDate').value;
  const dates=[...new Set(all.map(x=>x.date))];
  $('msDate').innerHTML='<option value="">All dates</option>'+dates.map(d=>`<option value="${d}" ${d===sel?'selected':''}>${fmtDate(d)} (${all.filter(x=>x.date===d).length})</option>`).join('');
  const rows=missingFiltered(),today=new Date(todayStr());
  $('msTable').innerHTML=rows.length?`<table><tr><th>Sheet date</th><th>Tracking ID</th><th>SKU</th><th>Days pending</th></tr>${rows.map(x=>{const days=Math.round((today-new Date(x.date))/864e5);return `<tr><td>${fmtDate(x.date)}</td><td>${esc(x.id)}</td><td>${esc(x.sku)}</td><td>${days>0?`<span class="pill ${days>3?'err':'warn'}">${days} day${days>1?'s':''}</span>`:'<span class="pill muted">Today</span>'}</td></tr>`;}).join('')}</table>`:'<div class="empty">No missing tracking IDs.</div>';
}
$('msExport').onclick=()=>{
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(missingFiltered().map(x=>({'Sheet date':fmtDate(x.date),'Tracking ID':x.id,SKU:x.sku}))),'Missing IDs');
  XLSX.writeFile(wb,`Myntra_Missing_IDs_${fmtDate(todayStr())}.xlsx`);
};

/* ---------- Backup / restore ---------- */
$('backupBtn').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));
  a.download=`myntra-recon-backup-${todayStr()}.json`;a.click();
};
$('restoreBtn').onclick=()=>$('restoreFile').click();
$('restoreFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d.days)throw new Error('Not a backup file');
    if(!confirm('Replace all current data with this backup?'))return;
    db=d;db.scans=db.scans||[];save();renderAll();toast('Backup restored');
  }catch(err){toast('Restore failed: '+err.message);}
  e.target.value='';
};

function renderAll(){
  renderUpload();renderRecon();renderReport();renderMissing();
  const n=allPending().length;$('missBadge').textContent=n;$('missBadge').style.display=n?'inline-block':'none';
}
renderAll();
</script>
</body>
</html>
